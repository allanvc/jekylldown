# R CMD check on Linux and Windows, plus a Windows end-to-end smoke test
# of the isolated toolchain (install_ruby -> new_site -> build_site).
name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ${{ matrix.os }}
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::archive
      - uses: r-lib/actions/check-r-package@v2

  toolchain-windows:
    runs-on: windows-latest
    name: install_ruby() smoke test (windows)
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::archive
      - name: install_ruby, scaffold, build and serve a site
        shell: Rscript {0}
        run: |
          install.packages(".", repos = NULL, type = "source")
          library(jekylldown)
          install_ruby()
          install_git()
          check()
          new_site("smoke", theme = "minima")
          build_site("smoke")
          stopifnot(file.exists("smoke/_site/index.html"))
          serve_site("smoke", background = TRUE)
          stop_server("smoke")
      - name: al-folio end to end (git-sourced gems)
        shell: Rscript {0}
        run: |
          library(jekylldown)
          new_site("smoke-alfolio", theme = "al-folio", demo = FALSE)
          bundle_install("smoke-alfolio")
          build_site("smoke-alfolio")
          stopifnot(file.exists("smoke-alfolio/_site/index.html"))
